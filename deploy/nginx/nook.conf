# nginx in front of Nook on a cloud server (Stage 20, docs/deploy-gcp.md).
#
#   visitor ──HTTPS──▶ nginx (this file: certificate + password) ──▶ 127.0.0.1:8081 (Nook's Caddy) ──▶ website / API
#
# Nook has no passwords (people just pick a name), so nginx asks for one before anything reaches Nook.
# Replace nook.example.com with your domain, then:
#   sudo cp deploy/nginx/nook.conf /etc/nginx/sites-available/nook
#   sudo ln -s /etc/nginx/sites-available/nook /etc/nginx/sites-enabled/nook
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nook.example.com      # adds the HTTPS certificate (Let's Encrypt) and renews it

# WebSockets (live updates, chat, Quiz Party): pass the "Upgrade" handshake on
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name nook.example.com;

    # Don't say which nginx version this is
    server_tokens off;

    # Songs up to MAX_UPLOAD_MB (100 MB by default), plus the form around them
    client_max_body_size 110m;

    # The lock: one login per person, made with `sudo htpasswd /etc/nginx/nook.htpasswd <name>`
    auth_basic "Nook";
    auth_basic_user_file /etc/nginx/nook.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # Who the visitor is and that they used HTTPS (Nook trusts these only from this machine)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx's login stays with nginx; Nook doesn't need it
        proxy_set_header Authorization "";

        # WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The Companion streams its answers word by word, and big uploads take a while
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 300s;
    }
}
