# Stage 8: every push and pull request is checked automatically on GitHub's machines.
#
#   api ──┐
#         ├──► docker: build both images, start everything with Compose, check it answers through Caddy
#   web ──┘
#
# Results: the "Actions" tab on GitHub, and a ✓ or ✗ next to each commit.

name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # Real PostgreSQL and Valkey for the tests, like on your PC
    services:
      postgres:
        image: pgvector/pgvector:pg16 # Postgres + pgvector (Stage 9)
        env:
          POSTGRES_USER: nook
          POSTGRES_PASSWORD: nook
          POSTGRES_DB: nook_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nook" --health-interval 5s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: --health-cmd "valkey-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: Website — types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker — build images, start everything, smoke test
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settings, like a user would (with a password full of URL-unfriendly characters)
        run: |
          cp .env.example .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=p@ss:w/rd#1|' .env
      - name: Build the images
        run: docker compose build
      - name: Start everything and wait until healthy (the same command as start.sh)
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through Caddy
        run: |
          set -e
          # pages (HTTPS with Caddy's local certificate, so -k)
          curl -fsSk https://localhost/ -o /dev/null
          curl -fsSk https://localhost/chill -o /dev/null
          curl -fsSk https://localhost/music -o /dev/null
          curl -fsSk https://localhost/companion -o /dev/null
          # the API behind Caddy: tips come from the seeded database
          curl -fsSk https://localhost/api/tips | grep -q '"slug":"one-thing"'
          # other PCs: plain HTTP on the network address works too
          curl -fsS http://127.0.0.1/api/songs -H "X-Client-Id: 3f1c2b6e-9d5a-4c8e-8f00-123456789abc" -o /dev/null
          # the API reports a healthy database and Valkey
          docker compose exec -T api node -e "fetch('http://127.0.0.1:4000/health').then(r=>r.json()).then(j=>{console.log(j);process.exit(j.valkey==='up'?0:1)})"
          echo "✓ Nook answers through Caddy"
      # Stage 19: a real browser clicks through Nook (through Caddy, like a person on the network)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            quality/package-lock.json
      - name: End-to-end tests (Playwright)
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=https://localhost npx playwright test
      - name: Lighthouse on every app page (phone settings)
        working-directory: quality
        run: |
          npm ci
          CHROME_PATH=$(node -e "console.log(require('../web/node_modules/playwright-core').chromium.executablePath())") \
            BASE_URL=https://localhost MIN=90 MIN_PERF=80 npm run lighthouse
      - name: Load test (k6, 50 people at once)
        run: docker run --rm --network host -v "$PWD/quality/k6:/k6:ro" -e BASE_URL=http://127.0.0.1 -e WRITES=1 grafana/k6:1.3.0 run --quiet /k6/load.js
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            web/e2e-report
            web/test-results
            quality/report
          if-no-files-found: ignore
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --tail 80
      - name: Stop
        if: always()
        run: docker compose down -v
