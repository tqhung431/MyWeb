# Nook with Docker Compose.
#
# Settings come from the .env file next to this one (copy .env.example to .env).
# Which parts start is set by COMPOSE_PROFILES in .env:
#   app         API, worker, website and Caddy: the whole Nook (default in .env.example)
#   ai          + the local AI for the Free-time Companion (Ollama and its models)
#   monitoring  + Grafana with traces and metrics (http://localhost:3001)
#
#   docker compose up -d --build              start (or update) what COMPOSE_PROFILES says
#   docker compose down                       stop (your data stays in the volumes)
#   docker compose up -d db valkey            only the services `npm run dev` needs (developers)
#
# With "app", open https://localhost on this PC, or http://<this PC's IP> on other PCs.

# Shared OpenTelemetry settings (Stage 8). Telemetry is off until OTEL_EXPORTER_OTLP_ENDPOINT is
# set in .env (to http://otel-lgtm:4318 with the monitoring profile).
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none
  OTEL_SEMCONV_STABILITY_OPT_IN: http # current names for HTTP metrics (http.server.request.duration)

# The project name is the prefix of the data volumes (nook_db-data, ...). Fixed here, so your
# data stays the same whatever the folder is called. Coming from MyWeb? See README.md.
name: nook

# The database account. Change POSTGRES_PASSWORD only before the first start (see .env.example).
x-db: &db-account
  POSTGRES_USER: ${POSTGRES_USER:-nook}
  POSTGRES_DB: ${POSTGRES_DB:-nook}

services:
  # --- Data ---------------------------------------------------------------------

  db:
    image: pgvector/pgvector:pg16 # PostgreSQL 16 + the pgvector extension (Stage 9: embeddings)
    environment:
      <<: *db-account
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nook}
    ports:
      - "127.0.0.1:5432:5432" # this PC only (for npm run dev and tools)
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # --- The app (profile "app") ------------------------------------------------------

  api:
    profiles: [app]
    build: ./api
    image: nook-api
    environment: &api-env
      <<: *otel
      OTEL_SERVICE_NAME: nook-api
      # The password is passed separately (PGPASSWORD), so characters like @ : / # in it are fine
      DATABASE_URL: postgres://${POSTGRES_USER:-nook}@db:5432/${POSTGRES_DB:-nook}
      PGPASSWORD: ${POSTGRES_PASSWORD:-nook}
      VALKEY_URL: redis://valkey:6379
      HOST: 0.0.0.0 # inside Docker's private network; only Caddy can reach it
      PORT: "4000"
      TRUST_PROXY: "1" # Caddy is one trusted hop in front: real visitor IPs, HTTPS detection
      # Stage 11: how long Nook keeps data (days). See .env.example.
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-90}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-30}
      MEDIA_DIR: /app/media
      # Stage 9: where Ollama is. Without the ai profile it isn't running, and the Companion says so.
      # Set OLLAMA_URL= (empty) in .env to switch the AI off completely.
      OLLAMA_URL: ${OLLAMA_URL-http://ollama:11434}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen2.5:1.5b}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-paraphrase-multilingual}
    volumes:
      - media-data:/app/media # uploaded songs and their covers
      - ./music-import:/import:ro # songs to import: docker compose exec api node dist/music/import.js /import
    depends_on:
      db: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  worker:
    profiles: [app]
    build: ./api
    image: nook-api # same code as the API...
    command: ["node", "--import", "./dist/telemetry.js", "dist/worker.js"] # ...started as the background worker
    environment:
      <<: *api-env
      OTEL_SERVICE_NAME: nook-worker
    depends_on:
      api: { condition: service_healthy } # the API runs the database migrations first
    restart: unless-stopped

  web:
    profiles: [app]
    build:
      context: ./web
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_REALTIME_WEBSOCKET: "1"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: nook-web
      API_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    profiles: [app]
    image: caddy:2.11
    ports:
      - "${HTTP_PORT:-80}:80" # open to your network: other PCs use http://<this PC's IP>
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      # Stage 8: tracing_on / tracing_off, and where Caddy sends traces (gRPC port 4317)
      CADDY_TRACING: ${CADDY_TRACING:-tracing_off}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${CADDY_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # its certificates, incl. the local certificate authority
      - caddy-config:/config
    depends_on: [web, api]
    restart: unless-stopped

  # --- Monitoring (profile "monitoring", Stage 8) --------------------------------------
  # Grafana's all-in-one OpenTelemetry image: a collector + Prometheus (metrics) + Tempo (traces)
  # + Loki (logs) + Grafana, in one container. Fine for learning; real setups run them separately.
  otel-lgtm:
    profiles: [monitoring]
    image: grafana/otel-lgtm:latest # pin a version once you've tried it
    ports:
      - "127.0.0.1:3001:3000" # Grafana: http://localhost:3001
    restart: unless-stopped

  # --- Local AI (profile "ai", Stage 9) -------------------------------------------------
  # Ollama runs open models on this PC: nothing is sent to an AI company. Works on the CPU;
  # with an NVIDIA GPU, uncomment "deploy" below (needs the NVIDIA Container Toolkit).
  ollama:
    profiles: [ai]
    image: ollama/ollama:latest # pin a version once you've tried it
    ports:
      - "127.0.0.1:11434:11434" # this PC only: lets `npm run dev` use it too (OLLAMA_URL in api/.env)
    volumes:
      - ollama-models:/root/.ollama # downloaded models stay here
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m} # keep the model in memory between questions
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      start_period: 10s
      retries: 10
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    restart: unless-stopped

  # Downloads the two models, then exits. Fast after the first time (they're already in the volume).
  ollama-models:
    profiles: [ai]
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434 # talk to the ollama service, not itself
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen2.5:1.5b}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-paraphrase-multilingual}
    entrypoint: ["sh", "-c", "ollama pull \"$$AI_CHAT_MODEL\" && ollama pull \"$$AI_EMBED_MODEL\""]
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

volumes:
  ollama-models:
  media-data:
  db-data:
  valkey-data:
  caddy-data:
  caddy-config:
