# MyWeb with Docker Compose (Stage 7).
#
#   docker compose up -d                       database, Valkey and Mailpit only, for `npm run dev`
#   docker compose --profile app up -d --build EVERYTHING: + API, worker, website and Caddy
#   docker compose --profile app down          stop (your data stays in the volumes)
#
# With the app profile, open https://localhost on this PC, or http://<this PC's IP> on other PCs.
#
#   ... --profile app --profile monitoring up -d   + Grafana with traces and metrics (Stage 8):
#                                                    http://localhost:3001 (see docs/stage-8.md)
# Settings (passwords, ports) come from the .env file next to this one; see .env.example.

# Shared OpenTelemetry settings (Stage 8). Telemetry is off until OTEL_EXPORTER_OTLP_ENDPOINT is
# set in .env (to http://otel-lgtm:4318 with the monitoring profile).
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none
  OTEL_SEMCONV_STABILITY_OPT_IN: http # current names for HTTP metrics (http.server.request.duration)

services:
  # --- Data ---------------------------------------------------------------------

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: myweb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myweb}
      POSTGRES_DB: myweb
    ports:
      - "127.0.0.1:5432:5432" # this PC only (for npm run dev and tools)
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myweb"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # A pretend mail server: emails land in the web inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  # --- The app (profile "app") ------------------------------------------------------

  api:
    profiles: [app]
    build: ./api
    image: myweb-api
    environment: &api-env
      <<: *otel
      OTEL_SERVICE_NAME: myweb-api
      DATABASE_URL: postgres://myweb:${POSTGRES_PASSWORD:-myweb}@db:5432/myweb
      VALKEY_URL: redis://valkey:6379
      HOST: 0.0.0.0 # inside Docker's private network; only Caddy can reach it
      PORT: "4000"
      TRUST_PROXY: "1" # Caddy is one trusted hop in front: real visitor IPs, HTTPS detection
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-MyWeb <hello@myweb.local>}
      MEDIA_DIR: /app/media
    volumes:
      - media-data:/app/media # uploaded songs and their covers
      - ./music-import:/import:ro # songs to import: docker compose exec api node dist/music/import.js /import
    depends_on:
      db: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  worker:
    profiles: [app]
    build: ./api
    image: myweb-api # same code as the API...
    command: ["node", "--import", "./dist/telemetry.js", "dist/worker.js"] # ...started as the background worker
    environment:
      <<: *api-env
      OTEL_SERVICE_NAME: myweb-worker
    depends_on:
      api: { condition: service_healthy } # the API runs the database migrations first
    restart: unless-stopped

  web:
    profiles: [app]
    build:
      context: ./web
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_REALTIME_WEBSOCKET: "1"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: myweb-web
      API_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    profiles: [app]
    image: caddy:2.11
    ports:
      - "${HTTP_PORT:-80}:80" # open to your network: other PCs use http://<this PC's IP>
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      # Stage 8: tracing_on / tracing_off, and where Caddy sends traces (gRPC port 4317)
      CADDY_TRACING: ${CADDY_TRACING:-tracing_off}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${CADDY_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # its certificates, incl. the local certificate authority
      - caddy-config:/config
    depends_on: [web, api]
    restart: unless-stopped

  # --- Monitoring (profile "monitoring", Stage 8) --------------------------------------
  # Grafana's all-in-one OpenTelemetry image: a collector + Prometheus (metrics) + Tempo (traces)
  # + Loki (logs) + Grafana, in one container. Fine for learning; real setups run them separately.
  otel-lgtm:
    profiles: [monitoring]
    image: grafana/otel-lgtm:latest # pin a version once you've tried it
    ports:
      - "127.0.0.1:3001:3000" # Grafana: http://localhost:3001
    restart: unless-stopped

volumes:
  media-data:
  db-data:
  valkey-data:
  caddy-data:
  caddy-config:
