# Stage 3: only the database runs in Docker for now.
# Stage 7 will add the web app, the API and Caddy to this file.
#
#   docker compose up -d db     start PostgreSQL in the background
#   docker compose down         stop it (your data stays in the volume)

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: myweb
      POSTGRES_PASSWORD: myweb # fine for learning on your PC; never reuse this in production
      POSTGRES_DB: myweb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myweb"]
      interval: 5s
      retries: 10

volumes:
  db-data:
